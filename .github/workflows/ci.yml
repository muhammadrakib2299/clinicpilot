name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same ref supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node · lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node: the pnpm cache needs the store path to exist.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  python:
    name: Python · ruff, pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: apps/ai/.python-version
          cache: pip
          cache-dependency-path: |
            apps/ai/requirements.txt
            apps/ai/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest

  stack:
    name: Stack · compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This is Phase 0's exit gate, asserted rather than claimed.
      - name: Build and start the whole stack
        run: docker compose -f infra/docker-compose.yml up -d --build --wait

      - name: Probe the health endpoints
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/api/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:8000/health     | grep -q '"status":"ok"'
          curl -fsS -o /dev/null http://localhost:8081/
          # SPA fallback: an unknown client route must serve the shell, not 404.
          curl -fsS -o /dev/null http://localhost:8081/agents/deep/route

      - name: Verify pgvector is installed
        run: |
          docker compose -f infra/docker-compose.yml exec -T postgres \
            psql -U clinicpilot -d clinicpilot -c '\dx' | grep -q vector

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
