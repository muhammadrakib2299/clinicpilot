# ClinicPilot — full local stack.
#
#   docker compose -f infra/docker-compose.yml up -d --wait
#     -> Postgres+pgvector, Redis, n8n, api, ai, web, all health-gated.
#
# For day-to-day development run only the stateful services in Docker
# (`pnpm up`) and the three app services on the host via pnpm/uvicorn, so you
# keep hot reload. `pnpm up:all` is the containerised whole-stack path.
name: clinicpilot

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: clinicpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinicpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinicpilot}
      POSTGRES_DB: ${POSTGRES_DB:-clinicpilot}
    ports:
      # Host ports are overridable so a clone-and-run does not fail on a machine
      # that already has Postgres/Redis bound. Container ports never change.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinicpilot} -d ${POSTGRES_DB:-clinicpilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: clinicpilot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    container_name: clinicpilot-n8n
    restart: unless-stopped
    environment:
      N8N_PORT: 5678
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: UTC
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      # What the workflows call, and what lets them in. The gateway's
      # `internal/` surface takes no user, so the service token is the only
      # thing in front of it — same token the AI service uses.
      #
      # Defaults to the compose network name. Running the API on the host
      # instead (`pnpm up:infra` + `pnpm api`) means overriding it in .env:
      #   N8N_CLINICPILOT_API_URL=http://host.docker.internal:8080
      CLINICPILOT_API_URL: ${N8N_CLINICPILOT_API_URL:-http://api:8080}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-dev-only}
      # n8n 2.x blocks `$env` inside nodes by default, which would leave the
      # workflows with no way to learn either value above.
      #
      # The alternative is an n8n *credential* — encrypted in n8n's own store
      # and referenced by id. That is the better answer for a shared n8n, and
      # it is worse here: seeding one needs `N8N_ENCRYPTION_KEY` plus a
      # credentials file, so the token ends up committed in plaintext or the
      # workflow does not run on a fresh clone. This n8n is single-tenant, runs
      # the workflows in this repo and no others, and sits inside the same
      # trust boundary as the gateway it calls — the token is already in this
      # file's environment. Revisit if anyone else's workflows ever run here.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8ndata:/home/node/.n8n
      - ../workflows:/workflows:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: clinicpilot-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 8080
      # Both the containerised web (8081) and a host Vite dev server (5173).
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8081,http://localhost:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-clinicpilot}:${POSTGRES_PASSWORD:-clinicpilot}@postgres:5432/${POSTGRES_DB:-clinicpilot}
      # The unprivileged role `pnpm db:rls` creates. The owner above is a
      # superuser and bypasses RLS, so the gateway must never serve requests as
      # it. This is APP_DATABASE_URL as the compose network sees it — the
      # database is `postgres` here, and localhost is this container.
      APP_DATABASE_URL: ${APP_DATABASE_URL_COMPOSE:-}
      # No defaults, on purpose. NODE_ENV=production makes the gateway refuse to
      # boot on a missing value or an .env.example placeholder
      # (assertProductionSecrets); a fallback here would only hide which.
      JWT_SECRET: ${JWT_SECRET:-}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8000
      N8N_BASE_URL: http://n8n:5678
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Same image as the gateway, different entrypoint. An agent run holds a
  # connection open for tens of seconds and workers are what you scale when a
  # backlog builds, so it gets its own process — `docker compose up -d
  # --scale worker=3` is the whole story for throughput.
  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    # No container_name: a fixed one would make `--scale` impossible, which is
    # the one thing this service exists to allow.
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8000
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
    depends_on:
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy

  ai:
    build:
      context: ../apps/ai
    container_name: clinicpilot-ai
    restart: unless-stopped
    environment:
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8081,http://localhost:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-clinicpilot}:${POSTGRES_PASSWORD:-clinicpilot}@postgres:5432/${POSTGRES_DB:-clinicpilot}
      REDIS_URL: redis://redis:6379
      # Where this service calls *back* to: trace steps, task status and all
      # FHIR access go through the gateway (ADR-004, ADR-008). Without it the
      # default is localhost, which inside this container is the AI service
      # itself — every callback would quietly 404.
      API_URL: http://api:8080
      FHIR_BASE_URL: ${FHIR_BASE_URL:-https://hapi.fhir.org/baseR4}
      # The service boots without a key; `POST /run` answers 503 until one is set.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "${AI_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      # python:slim carries no curl or wget; urllib is always there.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: clinicpilot-web
    restart: unless-stopped
    # 8081, not 5173, so the container never collides with a host dev server.
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
  redisdata:
  n8ndata:
