server {
    listen 80;
    # The image's 10-listen-on-ipv6-by-default.sh only patches the stock config,
    # so a custom conf must declare IPv6 itself — otherwise `localhost` inside
    # the container resolves to ::1 and every connection is refused.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: unknown paths must fall through to the SPA shell,
    # not 404. Phase 1 adds real routes behind this.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, so assets are safe to pin forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must never be cached or deploys go stale.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
